name: 주식 정보 자동 알림

on:
  # v1.5.6: 사용자 결정으로 schedule 자동 트리거 부활 (수동 workflow_dispatch 병행)
  # ⚠️ trade-off: GitHub Actions schedule 큐 지연(최대 ~5h 관측) 가능성 잔존.
  #    정시 도착이 필요하면 "Run workflow" 수동 트리거 사용.
  schedule:
    - cron: '30 22 * * 0-4'  # UTC 일~목 22:30 → KST 월~금 07:30 오전 브리핑
    - cron: '30 7 * * 1-5'   # UTC 월~금 07:30 → KST 월~금 16:30 오후 브리핑
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 선택'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - afternoon

concurrency:
  group: stock-alert
  cancel-in-progress: true

jobs:
  send-stock-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 실행 모드 결정
        run: |
          # v1.5.6: workflow_dispatch 는 입력 mode 사용. schedule 등은 KST 13시 폴백.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            # 폴백: KST 13시 경계 (schedule cron 및 외부 트리거 — 07:30→morning, 16:30→afternoon)
            HOUR=$(TZ=Asia/Seoul date +%H)
            if [ "$HOUR" -lt 13 ]; then
              echo "RUN_MODE=morning"   >> $GITHUB_ENV
            else
              echo "RUN_MODE=afternoon" >> $GITHUB_ENV
            fi
          fi

      - name: 주식 알림 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_MODE: ${{ env.RUN_MODE }}
        run: python src/main.py
