name: 주식 정보 자동 알림

on:
  # v1.5.5: 수동 트리거 전용
  # schedule 트리거의 GitHub Actions 큐 지연(최대 5h 관측)으로 제거됨
  # 사용자가 GitHub Mobile 앱 또는 웹에서 "Run workflow" 로 실행
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 선택'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - afternoon

concurrency:
  group: stock-alert
  cancel-in-progress: true

jobs:
  send-stock-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 실행 모드 결정
        run: |
          # v1.5.5: workflow_dispatch 전용. else 폴백은 미래 트리거 추가 대비.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            # 폴백: KST 13시 경계 (iPhone Shortcuts 등 외부 트리거 미래 추가 대비)
            HOUR=$(TZ=Asia/Seoul date +%H)
            if [ "$HOUR" -lt 13 ]; then
              echo "RUN_MODE=morning"   >> $GITHUB_ENV
            else
              echo "RUN_MODE=afternoon" >> $GITHUB_ENV
            fi
          fi

      - name: 주식 알림 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_MODE: ${{ env.RUN_MODE }}
        run: python src/main.py
